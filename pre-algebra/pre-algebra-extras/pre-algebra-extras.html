<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pre-Algebra Extras - Pre-Algebra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        .back-link { align-self: flex-start; margin-bottom: 20px; }
        .back-link a { color: #58a6ff; text-decoration: none; font-size: 1rem; }
        .back-link a:hover { text-decoration: underline; }
        h1 { font-size: 2rem; font-weight: 300; margin-bottom: 30px; color: #f0f6fc; }
        .viewer-container {
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            background: #161b22;
        }
        .download-section { margin-top: 20px; }
        .download-section a {
            color: #58a6ff;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #58a6ff;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .download-section a:hover { background: #58a6ff; color: #0d1117; }
    </style>
</head>
<body>
    <div class="back-link"><a href="../pre-algebra.html">← Back to Pre-Algebra</a></div>
    <h1>Pre-Algebra Extras</h1>
    <div class="viewer-container" id="viewer">
        <!-- docMentis viewer will be rendered here -->
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#4a3a2a;font-size:1.2rem;">
            Loading viewer...
        </div>
    </div>
    <div class="download-section">
        <a href="Pre-algebra%20Extras.pptx" download>⬇ Download Pre-Algebra Extras.pptx</a>
    </div>

    <!-- Import docMentis from CDN -->
    <script type="importmap">
        {
            "imports": {
                "udoc-viewer": "https://unpkg.com/@docmentis/udoc-viewer@0.7.17/dist/udoc-viewer.js"
            }
        }
    </script>

    <script type="module">
        import { UDocClient } from 'udoc-viewer';

        async function loadViewer() {
            const container = document.getElementById('viewer');
            
            // Create the viewer client
            const client = await UDocClient.create();
            
            // Create the viewer instance
            const viewer = await client.createViewer({
                container: container,
                // Optional: customize the viewer appearance
                theme: 'dark',
                // Optional: hide the download button if you have your own
                // toolbar: { download: false }
            });

            // Load your PowerPoint file
            const fileUrl = 'Pre-algebra%20Extras.pptx';
            await viewer.load(fileUrl);
        }

        // Start the viewer
        loadViewer().catch(error => {
            console.error('Failed to load viewer:', error);
            document.getElementById('viewer').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#e94560;font-size:1.2rem;padding:20px;text-align:center;">
                    Failed to load document.<br>
                    <span style="font-size:0.9rem;color:#8a7a5a;">You can still download the file below.</span>
                </div>
            `;
        });
    </script>
</body>
</html>
